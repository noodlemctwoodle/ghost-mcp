name: release-please

# Automated versioning + CHANGELOG from Conventional Commits. On each push to main
# release-please opens/updates a release PR that bumps package.json and
# package-lock.json and writes CHANGELOG.md; merging that PR tags the release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
