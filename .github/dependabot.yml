# Automated dependency update PRs. Combined with the CI workflow, each update is
# built and unit-tested before it can be merged.
version: 2
updates:
  # Application + dev dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
    groups:
      # One PR for low-risk minor/patch bumps; majors get individual PRs to review.
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions used by the CI workflow (actions/checkout, actions/setup-node)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
